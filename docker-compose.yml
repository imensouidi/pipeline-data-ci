# Lance le service S3 local (SeaweedFS) et la pipeline, qui tourne toutes les 5 minutes.
services:
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.port=8333 -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data

  pipeline:
    build: .
    depends_on:
      - s3
    environment:
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: admin
    command: ["python", "-m", "pipeline", "--n-files", "5", "--seed", "42", "--every", "300"]
    volumes:
      - pipelinedata:/app/output
    restart: unless-stopped

volumes:
  s3data:
  pipelinedata:
