name: CI - Pipeline data

# Quand la CI se déclenche : à chaque push, à chaque pull request, ou à la main.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install -r requirements-dev.txt

      - name: Qualité du code (ruff)
        run: ruff check .

      - name: Exécution de la pipeline complète
        run: python -m pipeline --n-files 5 --seed 42

      - name: Relance de la pipeline (vérification anti-doublons)
        run: python -m pipeline --n-files 5 --seed 42

      - name: Tests d'intégration
        run: python -m pytest

      - name: Sauvegarde des CSV et de la base
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-pipeline
          path: |
            data/
            output/
            